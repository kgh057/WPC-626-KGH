<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>02. relative 포지션</title>
    <style>
        .bx{
            width: 300px;
            height: 300px;
            border: 2px solid blue;
            text-align: center;
            font-size: 24px;
            font-weight: bold;/* fwb */
            /* 글자세로중앙 */
            line-height: 300px;
        }

        #r1{
            /* 포지션 relative : por */
            position: relative;

            /* 위로부터 100px : t100 */
            top: 100px;

            /* 왼쪽으로부터 100px : l100 */
            left: 100px;
            
            /************************************* 
                [ 2. relative 포지션 ]
                 - 렐러티브! 라고 읽어주세요!
                
                 1. 위치이동속성이 적용된다!

                 2. 위치이동의 기준은 원래 있던 위치임!
                 (그래서 상대적인 즉, relative라는 단어를 씀!)
                 
                 3. 이동시 다른 요소에 영향이 없이 겹쳐질 수 있다! = 주변에 영향을 주지 않음
                 (겹쳐질 때 위치관계는 항상 static보다 위!
                 다른 포지션은 나중에 코딩된 요소가 위에 옴!)

                 4. 원래 있던 위치는 그대로 보존된다!
                 (의미: 기존 위치가 보존되기 때문에 본래의 디자인이 망가지지 않는다!)

                 5. 위치값 설정시 한 방향당 한가지 기준으로만 셋팅한다!
                 -> 수평방향 : left / right 중 하나
                 -> 수직방향 : top / bottom 중 하나
                 ->> 한방향에서 두가지를 같이 쓰면 top, left가 우선함!

                 6. margin은 그대로 적용된다!
                 (다른 static요소에 영향을 미친다!)
                 -> 본래 위치에서 마진을 적용한 것과 같음!

                 7. relative의 위치이동값을 안쓰면 static과 일반적인 배치가 똑같다!

                 8. relative는 겹쳐질 수 있으므로 위아래 관계가 성립한다!

                 기본적인 위치관계는 아래와 같다!
                 1) static보다 항상 위
                 2) static 포지션이 아닌 경우 나중에 그려진 요소가 위!
                 (손 놓고 손등 때리기!)
                 3) z-index 속성으로 숫자가 크면 위!
                 (주의: 숫자 비교는 같은 레벨에서 비교함!)

                
            *************************************/


            background: url(./images/ab5.jpg) no-repeat center/cover;
        }
        #r2{
            /* 포지션 relative */

            background: url(./images/ab4.jpg) no-repeat center/cover;
        }

        /* 첫번째 박스에 포지션 체크 */
        #s1{
            background-color: lightgreen;
        }
        #s2{
            background-color: lightcoral;
        }

        /* 제목넣기 : 렐러티브로! */
        
    </style>
</head>
<body>
    
    <!-- 제목 -->
    <h1 class="tit">Relative 포지션</h1>

    <div class="bx" id="r1">r1</div>
    <div class="bx" id="s1">s1</div>
    <div class="bx" id="r2">r2</div>
    <div class="bx" id="s2">s2</div>
    <!-- 
    [ 젠코딩(에밋코딩) ]

    .bx#s${s$}*3 
    ___________________

    . : 클래스
    # : 아이디
    $ : 증가숫자자리
    *숫자 : 반복생성횟수
    {} : 데이터출력(꺽쇠사이값)
    [] : 속성셋팅값
    > : 하위직계 자식요소
    + : 형제요소
    () : 요소 구분하기     
    ______________________
    ((샘플))
    header.my#key[title=hi]{메뉴}*2

    ul>li*3>a*4

    div.my#my$*2>section+article>img
    -->
   
    
</body>
</html>
