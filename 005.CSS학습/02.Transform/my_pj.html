<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나의 트랜스폼 작품</title>
    <!-- 트랜스폼 샘플 사이트
     https://tombap8.github.io/FED-RV-TOM-2024/002.HTML%ED%95%99%EC%8A%B5/05.Transform_PJ/index.html -->
    <style>
      /* 전체 배경넣기 */
      body {
        /* background: 색이반고윙/크; */
        /* background: 색 이미지 반복 고정 위치/크기; */
        /* background: url(./images/bg-main.jpg) no-repeat fixed center top/cover; */

        /* 1. 이미지 */
        background-image: url(./image/Ghibli-main2.jpg);
        /* 2. 반복여부 */
        background-repeat: no-repeat;
        /* 3. 고정 : 배경이미지 화면고정  */
        background-attachment: fixed;
        /* 4. 위치 : 가로(x축) 세로(y축)
                가로값 - left(기본값), right, center, 수치값
                세로값 - top, bottom, center(기본값), 수치값
            */
        background-position: center top;
        /* 5. 크기 : 가로(width) 세로(height)
                - 특이한 값들
                1) contain -> 배경이미지가 모두보임(비율맞게)
                2) cover -> 비율에 맞게 대상박스의 빈공간이 없음!
                3) 모두 채운후 비율없이 만드는 방법 100% 100%
            */
        background-size: cover;
      }

      /* 1. 제목 */
      .main-title {
        /* 박스 셋팅 */
        text-align: center;
        background-color: #ffffff68;
        border-radius: 50px;

        /* 글자 셋팅 */
        color: #fff;
        font-size: 50px;
        line-height: 100px;

        /* 글자 테두리 */
        text-shadow: 4px 0 #416033, -4px 0 #416033, 0 4px #416033,
          0 -4px #416033;
        /* -webkit-text-stroke: 1px red; */
      }

      /* 전체 부모박스 */
      .main-contents {
        /* 박스셋팅 */
        max-width: 1500px;
        margin: 100px auto;
        border: 10px solid #416033;
        border-radius: 20px;
        padding: 20px;

        /* 기본적으로 박스 크기를 잡으면
        그 크기는 컨텐트영역의 크기임.
        보더와 패딩은 바깥쪽으로 생김
        그래서 박스가 커짐!
        보더, 패딩을 크기셋팅에 포함시키려면
        box-sizing:border-box 셋팅해야함! */
        box-sizing: border-box;

        /* 겹쳐지는 부분 배경 흐리게 처리하기
        -> 백드롭필터! 블러! */
        backdrop-filter: blur(5px);
        /* backdrop-filter: sepia(90%); */
        /* backdrop-filter: invert(70%); */
        /* backdrop-filter: hue-rotate(120deg); */
        /* backdrop-filter: grayscale(100%); */
      }
      /* 부모박스 가상요소 clear셋팅(float때문에) */
      .main-contents::after {
        content: "";
        display: block;
        clear: both;
      }
      /* 캐릭터 박스 공통 */
      .main-contents > div {
        /* 옆으로 흐르게 */
        float: left;
        /* 5등분하기 */
        width: calc(100% / 5);
        /* 중앙정렬 tac */
        text-align: center;
      }
      /* 5번째 div 이후 자식 마진탑주기 */
      .main-contents > div:nth-child(5) ~ div {
        /* 위쪽 마진 */
        margin-top: 20px;
      }
      /* 캐릭터 이미지 공통 */
      .main-contents > div img {
        width: 200px;
        height: 200px;
        /* 원형 */
        border-radius: 50%;

        /* 트랜지션 trs */
        transition: 0.6s;
      }

      /********************************************** 
        [ Transform 효과주기 ]
        - 선택요소의 크기, 회전, 이동, 기울임
            등 변형을 하기위한 속성
        - 2D, 3D 지원됨
      ********************************************

        1. transform : rotateY(각도deg) - Y축회전
        - deg 는 각도의 단위(도:degree)

        [ 각도 단위 확장 ]
        (1) deg: 도 단위 (360 deg는 한 바퀴 회전)
        (2) grad: 그라디언트 (400 grad는 한 바퀴 회전)
        (3) rad: 라디안 (2π rad는 한 바퀴 회전)
        (4) turn: 턴 (1 turn은 한 바퀴 회전)

    **********************************************/

      #transform-box1:hover img {
        /* y축회전 : tfry */
        transform: rotateY(180deg);

        /* 동시효과중 필터주기 */
        filter: grayscale(100%);
        /* CSS 필터 적용하기
            : 필터속성은 흑백,흐림,세피아,명암,
            채도 등 출력이미지를 변경하고자 할때
            사용하는 속성
            (참고)
            https://www.w3schools.com/cssref/playit.php?filename=playcss_filter&preval=blur(5px)
        */
      }

      /********************************************** 
        2. 
    **********************************************/
      #transform-box2:hover img {
        /* x축이동 tftx */
        transform: translateX(50%);
        /* -> %단위 기준은 항상 자기자신의 크기다!!! */
      }

      /********************************************** 
        3.
    **********************************************/
      #transform-box3 img {
        /* 미리 x축 회전 해놓기 : tfrx */
        transform: rotateX(180deg);
        /* 필터블러 */
        filter: blur(2px);
      }
      /* 오버시 원상복귀 */
      #transform-box3:hover img {
        /* 미리 x축 회전 해놓기 : tfrx */
        transform: rotateX(0deg);
        /* 필터블러 제거 */
        filter: blur(0px);

        /* 오버시 2배 크기 */
        scale: 2;
      }

      /********************************************** 
        4. 
    **********************************************/
      #transform-box4:hover img {
        transform: translateX(-50%);
      }

      /********************************************** 
        5. 
    **********************************************/
      #transform-box5:hover img {
         /* y축이동 tfty */
         transform: translateY(200%);
        /* -> %단위 기준은 항상 자기자신의 크기다!!! */
      }
      /************************************** 
        6. 
    **************************************/
      /* 이미지 회전축 변경하기 */
      #transform-box6 img {
        /* transform-origin: right bottom; */
        transform-origin: 20% 20%;
      }
      #transform-box6:hover img {
        /* 원형회전 : tfr */
        /* transform: rotate(4587deg); */

        rotate: 4586deg;

        /* 트랜지션 시간 늘리기 */
        transition-duration: 10s;
      }

      /****************************************** 
        7. 
    ******************************************/
      #transform-box7:hover img {
        /* x축 skew  */
        /* transform: skewX(-30deg); */
        /* y축 skew  */
        transform: skewY(30deg);
      }

      /******************************************** 
        8. 
    ********************************************/
      #transform-box8 img {
        opacity: 0.5;
      }

      #transform-box8:hover img {
        opacity: 1;
        scale: 2;
      }
      /***************************************** 
        9. 제자리에서 돌기
    *****************************************/
      #transform-box9:hover img {
        rotate: 4586deg;
        transition-duration: 25s;
      }

      /***************************************** 
        10. 
    *****************************************/
      #transform-box10 img {
        width: 200px;
        height: 200px;
      }

      /* 이미지가 겹치게 앱솔루트 셋팅 */
      #transform-box10 img {
        position: absolute;
        width: 200px;
        height: 200px;
        border-radius: 50%;
      }

      /* 1. 첫번째 img자식 - 아시타카 원본 (돌아올 때) */
      #transform-box10 img:first-child {
        /* 처음에 90도로 숨겨짐 */
        transform: rotateY(90deg);
        /* 트랜지션 trs 바로 출발, 처음만 천천히 ease-in */
        transition: 0.4s ease-in;
      }

      /* 2. 첫번째 img자식 - 아시타카 오버시 */
      #transform-box10:hover img:first-child {
        /* 처음에 90도로 숨겨짐 */
        transform: rotateY(0deg);
        /* 트랜지션 trs :
        산 돌 동안 0.4초 기다림 /
        그대로 받아서 끝에 천천히 ease-out */
        transition: 0.4s ease-out 0.4s;
      }

      /* 3. 마지막째 img자식 - 산 원본 (돌아올 때) */
      #transform-box10 img:last-child {
        /* 처음에 0도로 보임 */
        transform: rotateY(0deg);
        /* 트랜지션 trs : 
        돌아올 때 아시타카 0.4초 기다림 /
        그대로 받아서 끝에 천천히 ease-out */
        transition: 0.4s ease-out 0.4s;
      }

      /* 4. 마지막째 img자식 - 산 오버시 */
      #transform-box10:hover img:last-child {
        /* 오버시 90도로 숨겨짐 */
        transform: rotateY(90deg);
        /* 트랜지션 trs : 바로 출발, 처음만 천천히 ease-in */
        transition: 0.4s ease-in;
      }
    </style>
  </head>
  <body>
    <!-- 1. 제목 -->
    <h1 class="main-title">지브리</h1>
    <!-- 2. 컨텐츠 박스 -->
    <section class="main-contents my">
      <div id="transform-box1">
        <img src="image/Ghibli01.jpg" alt="캐릭터" />
      </div>
      <div id="transform-box2">
        <img src="image/Ghibli02.jpg" alt="캐릭터" />
      </div>
      <div id="transform-box3">
        <img src="image/Ghibli03.jpg" alt="캐릭터" />
      </div>
      <div id="transform-box4">
        <img src="image/Ghibli04.jpg" alt="캐릭터" />
      </div>
      <div id="transform-box5">
        <img src="image/Ghibli05.jpg" alt="캐릭터" />
      </div>
      <div id="transform-box6">
        <img src="image/Ghibli06.jpg" alt="캐릭터" />
      </div>
      <div id="transform-box7">
        <img src="image/Ghibli07.jpg" alt="캐릭터" />
      </div>
      <div id="transform-box8">
        <img src="image/Ghibli08.jpg" alt="캐릭터" />
      </div>
      <div id="transform-box9">
        <img src="image/Ghibli09.jpg" alt="캐릭터" />
      </div>
      <div id="transform-box10">
        <img src="image/Ghibli11.jpg" alt="캐릭터" />
        <img src="image/Ghibli10.jpg" alt="캐릭터" />
      </div>
    </section>
  </body>
</html>
